# ============================================
# CONFIGURACIÓN GENERAL DEL PROYECTO
# ============================================
sonar.projectKey=almacen-inventario
sonar.projectName=Almacen Inventario
sonar.projectVersion=1.0.0

# ============================================
# DIRECTORIOS A ANALIZAR
# ============================================
sonar.sources=.
sonar.tests=tests

# ============================================
# CONFIGURACIÓN DE PYTHON
# ============================================
sonar.python.version=3.11
sonar.language=py

# ============================================
# EXCLUSIONES CRÍTICAS
# ============================================
sonar.exclusions=**/__pycache__/**,\
                 **/*.pyc,\
                 **/migrations/**,\
                 manage.py,\
                 **/asgi.py,\
                 **/wsgi.py,\
                 **/settings.py,\
                 **/apps.py,\
                 **/admin.py,\
                 **/tests.py,\
                 **/test_*.py,\
                 venv/**,\
                 env/**,\
                 .venv/**,\
                 staticfiles/**,\
                 db.sqlite3

# ============================================
# INCLUSIONES PARA TESTS
# ============================================
sonar.test.inclusions=**/*test.py,\
                      **/tests/**/*.py